name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Lint, Type-Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: diriddle_test
          POSTGRES_USER: diriddle_test
          POSTGRES_PASSWORD: diriddle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diriddle_test -d diriddle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://diriddle_test:diriddle_test@localhost:5432/diriddle_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-key-do-not-use-in-prod
      DEV_IN_MEMORY: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @diriddle/shared-types build

      - name: Generate Prisma client
        run: pnpm --filter @diriddle/api exec prisma generate

      - name: Run type-check
        run: pnpm run type-check

      - name: Run lint
        run: pnpm run lint

      - name: Run build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test
