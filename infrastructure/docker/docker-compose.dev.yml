services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: diriddle-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: diriddle_dev
      POSTGRES_USER: diriddle
      POSTGRES_PASSWORD: diriddle
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diriddle -d diriddle_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: diriddle-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-dev-data:
  redis-dev-data:
