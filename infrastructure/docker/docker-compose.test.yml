services:
  postgres-test:
    image: postgis/postgis:16-3.4-alpine
    container_name: diriddle-postgres-test
    environment:
      POSTGRES_DB: diriddle_test
      POSTGRES_USER: diriddle_test
      POSTGRES_PASSWORD: diriddle_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diriddle_test -d diriddle_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-test:
    image: redis:7.2-alpine
    container_name: diriddle-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
